spring.application.name=library-management
server.port=8081

# Cấu hình H2 Database (tương thích cú pháp MySQL) giúp ứng dụng chạy được ngay không cần cài đặt MySQL Server
spring.datasource.url=jdbc:h2:mem:library_management;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console tại http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

# Tài khoản admin quản trị (đăng nhập tại /admin/login)
