<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" fill="none">
  <defs>
    <linearGradient id="sunsetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#fdba74"/>
      <stop offset="70%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <rect width="300" height="420" rx="6" fill="url(#sunsetGrad)"/>
  <line x1="18" y1="0" x2="18" y2="420" stroke="#f1f5f9" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Clouds -->
  <path d="M40 70 Q70 50 100 70 Q130 60 160 75 Q130 90 40 85 Z" fill="#ffffff" fill-opacity="0.5"/>
  <path d="M180 110 Q210 95 240 110 Q260 105 280 118 Q240 130 180 120 Z" fill="#ffffff" fill-opacity="0.4"/>

  <!-- Title Top in stylized handwritten style -->
  <g transform="translate(150, 75)">
    <text x="0" y="0" font-family="'Georgia', serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Trốn lên</text>
    <text x="0" y="26" font-family="'Georgia', serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">mái nhà</text>
    <text x="0" y="52" font-family="'Georgia', serif" font-size="22" font-weight="800" fill="#fef08a" text-anchor="middle">để khóc</text>
    <text x="0" y="76" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Lam</text>
  </g>

  <!-- Rooftop structure -->
  <g transform="translate(0, 240)">
    <!-- Slanted corrugated / wooden roof tiles -->
    <polygon points="20,80 280,30 290,140 10,140" fill="url(#roofGrad)"/>
    <!-- Roof texture lines -->
    <line x1="60" y1="72" x2="50" y2="140" stroke="#92400e" stroke-width="2"/>
    <line x1="100" y1="65" x2="90" y2="140" stroke="#92400e" stroke-width="2"/>
    <line x1="140" y1="58" x2="130" y2="140" stroke="#92400e" stroke-width="2"/>
    <line x1="180" y1="50" x2="170" y2="140" stroke="#92400e" stroke-width="2"/>
    <line x1="220" y1="42" x2="210" y2="140" stroke="#92400e" stroke-width="2"/>

    <!-- Small character lying on roof gazing at sky -->
    <ellipse cx="145" cy="80" rx="14" ry="7" fill="#1e293b"/>
    <circle cx="132" cy="76" r="6" fill="#fbcfe8"/>
    <ellipse cx="160" cy="82" rx="10" ry="5" fill="#3b82f6"/>
  </g>

  <!-- Bottom NXB banner -->
  <rect x="0" y="380" width="300" height="40" fill="#1e293b"/>
  <text x="150" y="405" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">NXB TRẺ</text>
</svg>
