<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" fill="none">
  <defs>
    <linearGradient id="koreanBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="300" height="420" rx="6" fill="url(#koreanBlue)"/>
  <line x1="18" y1="0" x2="18" y2="420" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="2"/>

  <!-- Top Banner / Badge -->
  <rect x="0" y="24" width="300" height="45" fill="#1e3a8a"/>
  <text x="150" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" text-anchor="middle">GIÁO TRÌNH CHUẨN QUỐC TẾ</text>
  <text x="150" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#bfdbfe" text-anchor="middle">THEO KHUNG THAM CHIẾU HÀN QUỐC</text>

  <!-- Big Title in White & Yellow -->
  <text x="150" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">TIẾNG HÀN</text>
  <text x="150" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#facc15" text-anchor="middle">TỔNG HỢP</text>
  <text x="150" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">DÀNH CHO NGƯỜI VIỆT NAM</text>

  <!-- Level Badge -->
  <rect x="90" y="195" width="120" height="34" rx="17" fill="#ef4444"/>
  <text x="150" y="217" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">SƠ CẤP 2</text>

  <!-- Korean Gate / Palace silhouette -->
  <g transform="translate(75, 260)" fill="#60a5fa" opacity="0.4">
    <!-- Traditional roof -->
    <path d="M0 40 Q75 10 150 40 L140 50 Q75 25 10 50 Z"/>
    <path d="M15 70 Q75 45 135 70 L130 78 Q75 58 20 78 Z"/>
    <!-- Pillars -->
    <rect x="30" y="78" width="12" height="45"/>
    <rect x="65" y="78" width="20" height="45"/>
    <rect x="108" y="78" width="12" height="45"/>
  </g>

  <!-- Publisher logo bottom -->
  <rect x="110" y="380" width="80" height="22" rx="4" fill="#0284c7"/>
  <text x="150" y="395" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">MCBooks</text>
</svg>
