<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" fill="none">
  <rect width="300" height="420" rx="6" fill="#f8fafc"/>
  <line x1="18" y1="0" x2="18" y2="420" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Authors Top -->
  <text x="170" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">John Ng - Alvin Foo</text>

  <!-- Asian Chopsticks Motif on left -->
  <g transform="translate(65, 85)">
    <!-- Red chopsticks holder -->
    <rect x="0" y="0" width="18" height="20" rx="2" fill="#dc2626"/>
    <!-- Chopsticks sticking down -->
    <rect x="3" y="15" width="4" height="230" rx="2" fill="#1e293b"/>
    <rect x="11" y="15" width="4" height="230" rx="2" fill="#1e293b"/>
    <!-- Chopstick tops in red/gold -->
    <rect x="3" y="5" width="4" height="20" fill="#dc2626"/>
    <rect x="11" y="5" width="4" height="20" fill="#dc2626"/>
  </g>

  <!-- Book Title -->
  <text x="180" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">PHONG CÁCH</text>
  <text x="180" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">LÃNH ĐẠO</text>
  <text x="180" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#dc2626" text-anchor="middle">CHÂU Á</text>

  <!-- Subtitle italic -->
  <text x="180" y="270" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#b91c1c" text-anchor="middle">Heart to heart</text>
  <text x="180" y="290" font-family="'Georgia', serif" font-style="italic" font-size="13" fill="#b91c1c" text-anchor="middle">with Asian leaders</text>

  <!-- Publisher logo bottom -->
  <circle cx="180" cy="380" r="14" fill="#0f172a"/>
  <text x="180" y="384" font-family="'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">TG</text>
  <text x="180" y="404" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">NHÀ XUẤT BẢN THẾ GIỚI</text>
</svg>
