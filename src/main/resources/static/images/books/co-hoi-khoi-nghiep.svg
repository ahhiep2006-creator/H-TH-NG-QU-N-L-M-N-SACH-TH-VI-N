<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" fill="none">
  <rect width="300" height="420" rx="6" fill="#f8fafc"/>
  <line x1="18" y1="0" x2="18" y2="420" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Authors Top -->
  <text x="150" y="36" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">SEAN WISE &amp; BRAD FELD</text>

  <!-- Big Yellow Billboard -->
  <g transform="translate(45, 60)">
    <!-- Billboard legs -->
    <rect x="35" y="220" width="10" height="80" fill="#334155"/>
    <rect x="165" y="220" width="10" height="80" fill="#334155"/>
    <line x1="20" y1="280" x2="190" y2="280" stroke="#334155" stroke-width="6"/>

    <!-- Yellow Board -->
    <rect x="10" y="0" width="190" height="230" rx="6" fill="#facc15" stroke="#1e293b" stroke-width="5"/>

    <!-- Blackboard text inside billboard -->
    <text x="105" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" fill="#0f172a" text-anchor="middle">CƠ HỘI</text>
    <text x="105" y="105" font-family="'Impact', 'Arial Black', sans-serif" font-size="32" fill="#0f172a" text-anchor="middle">KHỞI</text>
    <text x="105" y="155" font-family="'Impact', 'Arial Black', sans-serif" font-size="32" fill="#0f172a" text-anchor="middle">NGHIỆP</text>

    <!-- Subtitle -->
    <text x="105" y="185" font-family="'Georgia', serif" font-style="italic" font-size="13" font-weight="600" fill="#334155" text-anchor="middle">Startup Opportunities</text>
    
    <!-- Paper airplane flying off right -->
    <g transform="translate(160, 20) rotate(15)">
      <polygon points="0,0 35,15 10,25 0,0" fill="#facc15" stroke="#0f172a" stroke-width="2.5"/>
      <polygon points="10,25 35,15 20,35 10,25" fill="#eab308" stroke="#0f172a" stroke-width="2"/>
    </g>
  </g>

  <!-- City skyline silhouette sketch at bottom -->
  <g transform="translate(40, 340)" stroke="#1e293b" stroke-width="2" fill="none">
    <path d="M0 25 L15 25 L15 10 L30 10 L30 25 L50 25 L50 0 L70 0 L70 25 L110 25 L110 15 L140 15 L140 25 L180 25 L180 5 L200 5 L200 25 L220 25"/>
  </g>
</svg>
