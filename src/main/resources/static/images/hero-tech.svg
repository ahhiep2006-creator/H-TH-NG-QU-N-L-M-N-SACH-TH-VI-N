<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0c1427"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="65%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="75%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tabletGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Deep Background -->
  <rect width="1600" height="700" fill="url(#bgGrad)"/>
  <rect width="1600" height="700" fill="url(#glowBlue)"/>
  <rect width="1600" height="700" fill="url(#glowCyan)"/>

  <!-- Network Grid Lines in Background -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <path d="M0 150 L1600 150 M0 300 L1600 300 M0 450 L1600 450 M0 600 L1600 600"/>
    <path d="M200 0 L200 700 M400 0 L400 700 M600 0 L600 700 M800 0 L800 700 M1000 0 L1000 700 M1200 0 L1200 700 M1400 0 L1400 700"/>
  </g>

  <!-- Digital Device Illustration on Right (Matching Image 2) -->
  <g transform="translate(950, 120)">
    <!-- Smartphone top right -->
    <g transform="rotate(-15 280 80)">
      <rect x="220" y="20" width="130" height="230" rx="20" fill="url(#tabletGrad)" stroke="#475569" stroke-width="3"/>
      <rect x="228" y="35" width="114" height="195" rx="10" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>
      <circle cx="285" cy="130" r="28" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2"/>
      <!-- User profile in phone -->
      <circle cx="285" cy="122" r="9" fill="#e0f2fe"/>
      <path d="M272 144 C272 135 298 135 298 144 Z" fill="#e0f2fe"/>
    </g>

    <!-- Large Tablet in Hands -->
    <g transform="rotate(8 160 260)">
      <rect x="20" y="160" width="380" height="260" rx="24" fill="url(#tabletGrad)" stroke="#64748b" stroke-width="4"/>
      <rect x="36" y="176" width="348" height="228" rx="14" fill="url(#screenGrad)" stroke="#38bdf8" stroke-width="2"/>

      <!-- People silhouettes on screen -->
      <g opacity="0.75" fill="#bae6fd">
        <circle cx="100" cy="270" r="14"/>
        <path d="M78 310 C78 292 122 292 122 310 Z"/>
        <circle cx="150" cy="265" r="16"/>
        <path d="M125 310 C125 288 175 288 175 310 Z"/>
        <circle cx="210" cy="268" r="15"/>
        <path d="M188 310 C188 290 232 290 232 310 Z"/>
        <circle cx="270" cy="272" r="13"/>
        <path d="M250 310 C250 294 290 294 290 310 Z"/>
        <circle cx="320" cy="266" r="15"/>
        <path d="M298 310 C298 290 342 290 342 310 Z"/>
      </g>
    </g>

    <!-- Glowing Network Nodes and Connecting Lines -->
    <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.7">
      <line x1="80" y1="200" x2="-80" y2="120"/>
      <line x1="120" y1="360" x2="-30" y2="400"/>
      <line x1="300" y1="120" x2="160" y2="240"/>
      <line x1="360" y1="240" x2="480" y2="180"/>
      <line x1="280" y1="380" x2="420" y2="440"/>
    </g>

    <!-- Floating Node Badges with avatars -->
    <g transform="translate(-100, 100)">
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      <circle cx="0" cy="0" r="26" fill="#1e293b"/>
      <circle cx="0" cy="-6" r="8" fill="#38bdf8"/>
      <path d="M-12 12 C-12 4 12 4 12 12 Z" fill="#38bdf8"/>
    </g>

    <g transform="translate(480, 180)">
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#06b6d4" stroke-width="3"/>
      <circle cx="0" cy="0" r="22" fill="#1e293b"/>
      <circle cx="0" cy="-5" r="7" fill="#06b6d4"/>
      <path d="M-10 10 C-10 3 10 3 10 10 Z" fill="#06b6d4"/>
    </g>

    <g transform="translate(-40, 410)">
      <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#60a5fa" stroke-width="3"/>
      <circle cx="0" cy="0" r="24" fill="#1e293b"/>
      <circle cx="0" cy="-5" r="7.5" fill="#60a5fa"/>
      <path d="M-11 11 C-11 4 11 4 11 11 Z" fill="#60a5fa"/>
    </g>

    <g transform="translate(430, 440)">
      <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="20" fill="#1e293b"/>
      <circle cx="0" cy="-4" r="6" fill="#38bdf8"/>
      <path d="M-9 9 C-9 3 9 3 9 9 Z" fill="#38bdf8"/>
    </g>
  </g>
</svg>
